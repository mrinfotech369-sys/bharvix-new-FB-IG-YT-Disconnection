name: Scheduled Job & Deployment

on:
  push:
    branches:
      - main
  schedule:
    # Trigger twice a day or every hour to process posts/analytics
    # GitHub Action scheduled runs can be delayed, but this is a common workaround for Vercel Hobby plan limits.
    - cron: '0 * * * *' # Every hour
  workflow_dispatch: # Allows manual trigger

jobs:
  # Job to trigger the cron endpoint on Vercel
  trigger-cron:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Daily Cron Job
        run: |
          curl -X POST "https://${{ secrets.VERCEL_PROJECT_URL }}/api/fetch-analytics" \
          -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
      
      - name: Trigger Post Scheduler
        run: |
          curl -X POST "https://${{ secrets.VERCEL_PROJECT_URL }}/api/cron/schedule-posts" \
          -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"

  # Job to deploy to Vercel
  deploy:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - name: Install Vercel CLI
        run: npm install --global vercel@latest
      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
      - name: Build Project Artifacts
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
      - name: Deploy Project Artifacts to Vercel
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
